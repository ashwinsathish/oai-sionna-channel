// Baseline AWGN channel model for the RFsimulator phy-test loopback.
// Establishes a known-good reference before the EXTERNAL_CIR (Sionna RT)
// model is introduced. ploss_dB = 0 => pass-through gain; noise_power_dB
// sets the operating SNR.
channelmod = {
  max_chan = 10;
  modellist = "DefaultChannelList";
  DefaultChannelList = (
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = -30;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};
