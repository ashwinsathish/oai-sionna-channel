// EXTERNAL_CIR channel model: taps + path loss come from the Sionna RT
// OAICIRv1 file; noise_power_dB is the operating noise (same as the AWGN
// baseline so a unit-tap file reproduces it). cir_file is absolute.
channelmod = {
  max_chan = 10;
  modellist = "DefaultChannelList";
  DefaultChannelList = (
    {
      model_name     = "rfsimu_channel_ue0";
      type           = "EXTERNAL_CIR";
      cir_file       = "CHANGE_ME/path/to/your.cir";  // absolute path; see README "Running OAI by hand"
      noise_power_dB = -30;
      ploss_dB       = 0;
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};
